---
- name: "Ensure dockhand is running as a docker container"
  community.docker.docker_container:
    name: "{{ service_name }}"
    image: fnsys/dockhand:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ dockhand_config_dir }}:/app/data"
    restart_policy: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.dockhand.rule: "Host(`{{ service_name }}.{{ public_domain }}`) && {{ traefik_internal_client_ip_v3 }}"
      traefik.http.services.dockhand.loadbalancer.server.port: "3000"
      traefik.http.routers.dockhand.middlewares: "authelia@docker"

    networks:
      - name: "{{ traefik_network_name }}"
  vars:
    ansible_python_interpreter: "{{ ansible_docker_venv_bin }}"
